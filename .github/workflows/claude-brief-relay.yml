name: Claude Brief Relay

# Relays the brief Claude/Cowork writes to Telegram as a PDF, via Claude's
# own dedicated bot (@Anthopicdailynewsbot) — separate from the market bot
# used by market_brief.py / Cursor. Triggered by a push that touches
# outbox/claude-brief.html (Claude pushes via a PAT from its scheduled
# task — no api.github.com call needed, just plain git push).

on:
  push:
    branches: [main]
    paths:
      - 'outbox/claude-brief.html'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev libcairo2 shared-mime-info

      - name: Install python deps
        run: pip install requests weasyprint

      - name: Send PDF brief to Telegram (Claude bot)
        env:
          CLAUDE_TELEGRAM_BOT_TOKEN: ${{ secrets.CLAUDE_TELEGRAM_BOT_TOKEN }}
          CLAUDE_TELEGRAM_CHAT_ID: ${{ secrets.CLAUDE_TELEGRAM_CHAT_ID }}
        run: python send_claude_brief_pdf.py
